<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revista Digital - Página 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Neutraliza CUALQUIER css externo del repositorio -->
    <style>
        /* Reset total — sobreescribe cualquier CSS del repo */
        *, *::before, *::after {
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box !important;
        }

        html {
            height: 100% !important;
            width: 100% !important;
        }

        body {
            min-height: 100vh !important;
            width: 100% !important;
            background: #0d0f1a !important;
            font-family: 'Montserrat', sans-serif !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            overflow: hidden !important;
        }

        /* ── PHONE ── */
        #p3-container {
            width: 300px !important;
            height: 600px !important;
            min-width: 300px !important;
            max-width: 300px !important;
            min-height: 600px !important;
            max-height: 600px !important;
            background: #c8cacc !important;
            border-radius: 40px !important;
            border: 3px solid #2a2d45 !important;
            overflow: hidden !important;
            display: flex !important;
            flex-direction: column !important;
            box-shadow: 0 30px 80px rgba(0,0,0,0.7) !important;
            position: relative !important;
            flex-shrink: 0 !important;
        }

        /* ── HEADER ── */
        #p3-header {
            background: #c8cacc !important;
            flex-shrink: 0 !important;
            width: 100% !important;
        }

        #p3-statusbar {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            padding: 14px 16px 4px !important;
            font-size: 10px !important;
            font-weight: 700 !important;
            color: #222 !important;
        }

        #p3-statusicons {
            display: flex !important;
            gap: 5px !important;
            font-size: 10px !important;
            color: #222 !important;
        }

        #p3-navbar {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            padding: 4px 16px 8px !important;
        }

        #p3-hambtn {
            background: none !important;
            border: none !important;
            cursor: pointer !important;
            color: #333 !important;
            font-size: 18px !important;
            display: flex !important;
            align-items: center !important;
            width: auto !important;
            height: auto !important;
        }

        #p3-profilebtn {
            background: none !important;
            border: none !important;
            cursor: pointer !important;
            color: #888 !important;
            font-size: 20px !important;
            display: flex !important;
            align-items: center !important;
            width: auto !important;
            height: auto !important;
        }

        /* AVATAR — el más crítico */
        #p3-avatar {
            width: 50px !important;
            height: 50px !important;
            min-width: 50px !important;
            max-width: 50px !important;
            min-height: 50px !important;
            max-height: 50px !important;
            border-radius: 50% !important;
            border: 3px solid #e8a020 !important;
            overflow: hidden !important;
            display: block !important;
            flex-shrink: 0 !important;
        }

        #p3-avatar svg {
            width: 50px !important;
            height: 50px !important;
            min-width: 50px !important;
            max-width: 50px !important;
            min-height: 50px !important;
            max-height: 50px !important;
            display: block !important;
        }

        /* ── MAIN ── */
        #p3-main {
            flex: 1 !important;
            background: #c8cacc !important;
            overflow: hidden !important;
            width: 100% !important;
        }

        /* ── GRID ── */
        #p3-grid {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            gap: 14px 8px !important;
            padding: 16px 14px 8px !important;
            width: 100% !important;
        }

        .p3-app {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            gap: 5px !important;
            cursor: pointer !important;
        }
        .p3-app:active .p3-icon { transform: scale(0.88) !important; }

        .p3-icon {
            width: 56px !important;
            height: 56px !important;
            min-width: 56px !important;
            max-width: 56px !important;
            min-height: 56px !important;
            max-height: 56px !important;
            border-radius: 13px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 22px !important;
            color: #fff !important;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3) !important;
            transition: transform 0.1s !important;
        }

        .p3-label {
            font-size: 10px !important;
            color: #222 !important;
            font-weight: 600 !important;
            font-family: 'Montserrat', sans-serif !important;
        }

        .p3-mail     { background: linear-gradient(145deg,#2196f3,#0d6efd) !important; }
        .p3-chat     { background: linear-gradient(145deg,#2ecc40,#1a9e2e) !important; }
        .p3-cloud1   { background: linear-gradient(145deg,#7ecef4,#40b0d8) !important; }
        .p3-cloud2   { background: linear-gradient(145deg,#40b0d8,#1a8fb5) !important; }
        .p3-shield   { background: linear-gradient(145deg,#222,#3a3a3a) !important; }
        .p3-settings { background: linear-gradient(145deg,#999,#666) !important; }
        .p3-maps1    { background: linear-gradient(145deg,#c840c0,#8c1a90) !important; }
        .p3-maps2    { background: linear-gradient(145deg,#222,#3a3a3a) !important; }
        .p3-payment  { background: linear-gradient(145deg,#e83030,#b01818) !important; }

        /* ── FOOTER ── */
        #p3-footer {
            background: linear-gradient(135deg,#1a2340,#0e1428) !important;
            display: flex !important;
            border-top: 1px solid #2a3460 !important;
            flex-shrink: 0 !important;
            width: 100% !important;
            height: auto !important;
        }

        .p3-footbtn {
            flex: 1 !important;
            padding: 12px 8px !important;
            background: none !important;
            border: none !important;
            cursor: pointer !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 5px !important;
            color: #8899bb !important;
            font-family: 'Orbitron', sans-serif !important;
            font-size: 10px !important;
            font-weight: 700 !important;
            letter-spacing: 1.5px !important;
            text-transform: uppercase !important;
        }
        .p3-footbtn:hover { color: #fff !important; }
        #p3-ant { border-right: 1px solid #2a3460 !important; }

        /* ── OVERLAY ── */
        #p3-overlay {
            display: none !important;
            position: fixed !important;
            top: 0 !important; left: 0 !important;
            right: 0 !important; bottom: 0 !important;
            background: rgba(0,0,0,0.55) !important;
            align-items: center !important;
            justify-content: center !important;
            z-index: 99999 !important;
        }
        #p3-overlay.show { display: flex !important; }

        /* ── ALERT BOX ── */
        #p3-alertbox {
            background: #fff !important;
            border-radius: 20px !important;
            padding: 26px 22px 22px !important;
            width: 270px !important;
            text-align: center !important;
            box-shadow: 0 20px 60px rgba(0,0,0,0.45) !important;
            position: relative !important;
            animation: p3pop 0.2s ease !important;
        }
        @keyframes p3pop {
            from { transform: scale(0.82); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }

        #p3-closebtn {
            position: absolute !important;
            top: -13px !important; right: -13px !important;
            width: 34px !important; height: 34px !important;
            border-radius: 50% !important;
            background: #fff !important;
            border: 2px solid #222 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: pointer !important;
            font-size: 13px !important;
            color: #222 !important;
        }

        #p3-iconwrap {
            width: 80px !important; height: 80px !important;
            border-radius: 50% !important;
            margin: 0 auto 14px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 34px !important;
        }

        #p3-badge {
            display: inline-block !important;
            padding: 4px 14px !important;
            border-radius: 20px !important;
            font-size: 10px !important;
            font-weight: 700 !important;
            letter-spacing: 1.2px !important;
            text-transform: uppercase !important;
            margin-bottom: 10px !important;
        }
        .p3-balerta { background: #fde9b0 !important; color: #b07800 !important; }
        .p3-bcaso   { background: #fde0cc !important; color: #b04400 !important; }
        .p3-btip    { background: #d4f0d4 !important; color: #1a6a1a !important; }

        #p3-title {
            font-size: 15px !important; font-weight: 700 !important;
            color: #111 !important; margin-bottom: 10px !important;
            line-height: 1.35 !important;
            font-family: 'Montserrat', sans-serif !important;
        }
        #p3-msg {
            font-size: 11.5px !important; color: #555 !important;
            line-height: 1.65 !important; margin-bottom: 20px !important;
            font-family: 'Montserrat', sans-serif !important;
        }
        #p3-cta {
            width: 100% !important; padding: 12px 10px !important;
            border: none !important; border-radius: 10px !important;
            font-family: 'Montserrat', sans-serif !important;
            font-size: 11px !important; font-weight: 700 !important;
            letter-spacing: 1px !important; text-transform: uppercase !important;
            cursor: pointer !important; line-height: 1.5 !important;
        }
        .p3-red    { background: #e02020 !important; color: #fff !important; }
        .p3-orange { background: #f5a623 !important; color: #fff !important; }
        .p3-green  { background: #2e7d32 !important; color: #fff !important; }
    </style>
</head>
<body>

<div id="p3-container">

    <!-- HEADER -->
    <header id="p3-header">
        <div id="p3-statusbar">
            <span id="p3-clock">9:41</span>
            <div id="p3-statusicons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>
        <div id="p3-navbar">
            <button id="p3-hambtn"><i class="fas fa-bars"></i></button>

            <div id="p3-avatar">
                <!-- SVG con dimensiones forzadas en atributo y style -->
                <svg viewBox="0 0 60 60"
                     xmlns="http://www.w3.org/2000/svg"
                     width="50" height="50"
                     style="width:50px!important;height:50px!important;min-width:50px!important;max-width:50px!important;display:block!important;">
                    <circle cx="30" cy="30" r="30" fill="#f0c060"/>
                    <ellipse cx="30" cy="46" rx="18" ry="12" fill="#4a6fa5"/>
                    <circle cx="30" cy="24" r="11" fill="#f5c28a"/>
                    <path d="M19 22Q19 10 30 10Q41 10 41 22Q38 14 30 14Q22 14 19 22Z" fill="#6b3a1f"/>
                </svg>
            </div>

            <button id="p3-profilebtn"><i class="fas fa-user-circle"></i></button>
        </div>
    </header>

    <!-- MAIN -->
    <main id="p3-main">
        <div id="p3-grid">

            <div class="p3-app" data-key="mail">
                <div class="p3-icon p3-mail"><i class="fas fa-envelope"></i></div>
                <span class="p3-label">Mail</span>
            </div>
            <div class="p3-app" data-key="chat">
                <div class="p3-icon p3-chat"><i class="fas fa-comment-dots"></i></div>
                <span class="p3-label">Chat</span>
            </div>
            <div class="p3-app" data-key="cloud1">
                <div class="p3-icon p3-cloud1"><i class="fas fa-cloud"></i></div>
                <span class="p3-label">Cloud 1</span>
            </div>
            <div class="p3-app" data-key="cloud2">
                <div class="p3-icon p3-cloud2"><i class="fas fa-cloud-upload-alt"></i></div>
                <span class="p3-label">Cloud 2</span>
            </div>
            <div class="p3-app" data-key="shield">
                <div class="p3-icon p3-shield"><i class="fas fa-shield-alt"></i></div>
                <span class="p3-label">Shield</span>
            </div>
            <div class="p3-app" data-key="settings">
                <div class="p3-icon p3-settings"><i class="fas fa-cog"></i></div>
                <span class="p3-label">Settings</span>
            </div>
            <div class="p3-app" data-key="maps1">
                <div class="p3-icon p3-maps1"><i class="fas fa-map-marker-alt"></i></div>
                <span class="p3-label">Maps</span>
            </div>
            <div class="p3-app" data-key="maps2">
                <div class="p3-icon p3-maps2"><i class="fas fa-cog"></i></div>
                <span class="p3-label">Maps</span>
            </div>
            <div class="p3-app" data-key="payment">
                <div class="p3-icon p3-payment"><i class="fas fa-credit-card"></i></div>
                <span class="p3-label">Payment</span>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer id="p3-footer">
        <button class="p3-footbtn" id="p3-ant">
            <i class="fas fa-chevron-left"></i><span>ANTERIOR</span>
        </button>
        <button class="p3-footbtn" id="p3-sig">
            <i class="fas fa-chevron-right"></i><span>SIGUIENTE</span>
        </button>
    </footer>

</div>

<!-- MODAL -->
<div id="p3-overlay">
    <div id="p3-alertbox">
        <button id="p3-closebtn"><i class="fas fa-times"></i></button>
        <div id="p3-iconwrap"></div>
        <span id="p3-badge"></span>
        <h2 id="p3-title"></h2>
        <p id="p3-msg"></p>
        <button id="p3-cta"></button>
    </div>
</div>

<script>
var P3 = {
    mail:     { icon:'fas fa-envelope',        bg:'#ddeeff', color:'#1a6aaa', badge:'⚠ ALERTA',     bc:'p3-balerta', title:'El correo te puede traicionar',      msg:'El 90% de los ataques cibernéticos empiezan con un correo falso. Un clic en el lugar equivocado puede entregar tus datos sin que te des cuenta.',        cta:'NUNCA ABRAS<br>LINKS SOSPECHOSOS',       cc:'p3-red'    },
    chat:     { icon:'fas fa-comment-dots',     bg:'#e8f5e9', color:'#1a7a2a', badge:'📋 CASO REAL',  bc:'p3-bcaso',   title:'Tus chats no son privados',          msg:'Una estudiante compartió su número en un chat grupal. Días después recibió mensajes de extraños haciéndose pasar por su colegio.',                    cta:'TODO EMPEZÓ<br>CON UN MENSAJE',          cc:'p3-orange' },
    cloud1:   { icon:'fas fa-cloud',            bg:'#ddeeff', color:'#1a7aaa', badge:'⚠ ALERTA',     bc:'p3-balerta', title:'Tu nube puede tener filtraciones',    msg:'Si usas la misma contraseña en varias apps, un hacker puede acceder a todos tus archivos en la nube de una sola vez.',                                  cta:'USA CONTRASEÑAS<br>ÚNICAS',              cc:'p3-red'    },
    cloud2:   { icon:'fas fa-cloud-upload-alt', bg:'#ddeeff', color:'#1a7aaa', badge:'⚠ ALERTA',     bc:'p3-balerta', title:'Permisos que no notaste',            msg:'¿Le diste acceso a tus fotos, contactos y micrófono sin leer? Muchas apps guardan esa información aunque no las estés usando.',                         cta:'REVISA TUS<br>PERMISOS HOY',             cc:'p3-orange' },
    shield:   { icon:'fas fa-shield-alt',       bg:'#e8f5e9', color:'#1a6a1a', badge:'💡 TIP RÁPIDO', bc:'p3-btip',    title:'Activa tu escudo digital',           msg:'La verificación en dos pasos bloquea el 99% de los accesos no autorizados. Incluso si alguien roba tu contraseña, no podrá entrar.',                  cta:'ACTÍVALA EN TUS<br>APPS AHORA',          cc:'p3-green'  },
    settings: { icon:'fas fa-cog',              bg:'#e0e0e0', color:'#444444', badge:'💡 TIP RÁPIDO', bc:'p3-btip',    title:'Configurar es protegerte',           msg:'Las apps actualizadas corrigen vulnerabilidades. Una app sin actualizar es como dejar la puerta de tu casa abierta de noche.',                          cta:'MANTÉN TUS APPS<br>ACTUALIZADAS',        cc:'p3-green'  },
    maps1:    { icon:'fas fa-map-marker-alt',   bg:'#ede8f5', color:'#6a1a8a', badge:'⚠ ALERTA',     bc:'p3-balerta', title:'Saben dónde estás',                 msg:'Las apps de mapas pueden compartir tu ubicación en tiempo real con terceros. ¿Sabes quién tiene acceso a dónde estás ahora?',                         cta:'DESACTIVA LA<br>UBICACIÓN AL SALIR',     cc:'p3-red'    },
    maps2:    { icon:'fas fa-cog',              bg:'#e0e0e0', color:'#444444', badge:'📋 CASO REAL',  bc:'p3-bcaso',   title:'Una app que lo controlaba todo',     msg:"Un joven instaló una app de 'optimización'. Recopilaba sus contraseñas, fotos y mensajes en segundo plano sin que lo supiera.",                       cta:'INSTALA SOLO<br>APPS OFICIALES',         cc:'p3-orange' },
    payment:  { icon:'fas fa-credit-card',      bg:'#fde8e8', color:'#aa1a1a', badge:'⚠ ALERTA',     bc:'p3-balerta', title:'Tu tarjeta en riesgo',               msg:'Guardar datos bancarios en apps desconocidas es como prestarle tu tarjeta a un extraño. Un fallo de seguridad y pierdes tu dinero.',                    cta:'NUNCA GUARDES DATOS<br>EN APPS DUDOSAS', cc:'p3-red'    }
};

function p3Show(key) {
    var a = P3[key]; if (!a) return;
    var w = document.getElementById('p3-iconwrap');
    w.style.cssText = 'background:'+a.bg+' !important;';
    w.innerHTML = '<i class="'+a.icon+'" style="color:'+a.color+';font-size:34px;"></i>';
    var b = document.getElementById('p3-badge');
    b.textContent = a.badge;
    b.className = a.bc;
    b.setAttribute('id','p3-badge');
    document.getElementById('p3-title').textContent = a.title;
    document.getElementById('p3-msg').textContent = a.msg;
    var c = document.getElementById('p3-cta');
    c.innerHTML = a.cta;
    c.className = a.cc;
    c.setAttribute('id','p3-cta');
    document.getElementById('p3-overlay').classList.add('show');
}

function p3Close() {
    document.getElementById('p3-overlay').classList.remove('show');
}

document.addEventListener('DOMContentLoaded', function () {

    document.querySelectorAll('.p3-app').forEach(function(el) {
        el.addEventListener('click', function() { p3Show(this.getAttribute('data-key')); });
    });

    document.getElementById('p3-closebtn').addEventListener('click', p3Close);
    document.getElementById('p3-overlay').addEventListener('click', function(e) {
        if (e.target === this) p3Close();
    });

    var open = false;
    document.getElementById('p3-hambtn').addEventListener('click', function() {
        open = !open;
        this.querySelector('i').className = open ? 'fas fa-times' : 'fas fa-bars';
    });

    document.getElementById('p3-ant').addEventListener('click', function() { window.location.href = 'página2.html'; });
    document.getElementById('p3-sig').addEventListener('click', function() { window.location.href = 'página4.html'; });

    function tick() {
        var n = new Date();
        var el = document.getElementById('p3-clock');
        if (el) el.textContent = String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
    }
    tick(); setInterval(tick, 30000);
});
</script>
</body>
</html>
